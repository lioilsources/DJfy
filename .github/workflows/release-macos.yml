name: Release macOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build & Release macOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: .
        run: flutter pub get

      - name: Build macOS (release)
        working-directory: .
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          SC_CLIENT_ID: ${{ secrets.SC_CLIENT_ID }}
          SC_CLIENT_SECRET: ${{ secrets.SC_CLIENT_SECRET }}
          GETSONGBPM_KEY: ${{ secrets.GETSONGBPM_KEY }}
        run: flutter build macos --release --dart-define=LASTFM_API_KEY="$LASTFM_API_KEY" --dart-define=SC_CLIENT_ID="$SC_CLIENT_ID" --dart-define=SC_CLIENT_SECRET="$SC_CLIENT_SECRET" --dart-define=GETSONGBPM_KEY="$GETSONGBPM_KEY"

      - name: Package as ZIP
        run: |
          cd "./build/macos/Build/Products/Release"
          zip -r "$OLDPWD/DJfy-${{ github.ref_name }}-macOS.zip" "dj_deckify.app"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: DJfy-${{ github.ref_name }}-macOS.zip
          name: DJfy ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: true

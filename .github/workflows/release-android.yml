name: Release Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach the APK/AAB to (e.g. v1.4.1); empty = build the selected branch'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Release Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.x'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: .
        run: flutter pub get

      - name: Bump build number
        working-directory: .
        run: |
          BASE=$(grep '^version:' pubspec.yaml | sed -E 's/^version: ([0-9.]+).*/\1/')
          NEW="${BASE}+${{ github.run_number }}"
          sed -i -E "s/^version: .*/version: ${NEW}/" pubspec.yaml
          echo "Build version: ${NEW}"

      - name: Create keystore and key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo -n "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode --ignore-garbage > ./android/app/release.keystore
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > ./android/key.properties

      - name: Build release AAB
        working-directory: .
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          SC_CLIENT_ID: ${{ secrets.SC_CLIENT_ID }}
          SC_CLIENT_SECRET: ${{ secrets.SC_CLIENT_SECRET }}
          GETSONGBPM_KEY: ${{ secrets.GETSONGBPM_KEY }}
        run: flutter build appbundle --release --dart-define=LASTFM_API_KEY="$LASTFM_API_KEY" --dart-define=SC_CLIENT_ID="$SC_CLIENT_ID" --dart-define=SC_CLIENT_SECRET="$SC_CLIENT_SECRET" --dart-define=GETSONGBPM_KEY="$GETSONGBPM_KEY"

      - name: Build release APK
        working-directory: .
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          SC_CLIENT_ID: ${{ secrets.SC_CLIENT_ID }}
          SC_CLIENT_SECRET: ${{ secrets.SC_CLIENT_SECRET }}
          GETSONGBPM_KEY: ${{ secrets.GETSONGBPM_KEY }}
        run: flutter build apk --release --dart-define=LASTFM_API_KEY="$LASTFM_API_KEY" --dart-define=SC_CLIENT_ID="$SC_CLIENT_ID" --dart-define=SC_CLIENT_SECRET="$SC_CLIENT_SECRET" --dart-define=GETSONGBPM_KEY="$GETSONGBPM_KEY"

      - name: Verify APK signing certificate
        run: |
          APK="./build/app/outputs/flutter-apk/app-release.apk"
          echo "=== APK signing certificate ==="
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK" | head -20

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./build/app/outputs/bundle/release/app-release.aab
            ./build/app/outputs/flutter-apk/app-release.apk
          name: DJfy ${{ inputs.tag || github.ref_name }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: ${{ inputs.tag == '' }}  # don't demote an existing release

      - name: Upload to Firebase App Distribution
        if: inputs.tag == ''  # a re-run for an old tag was already distributed
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          groups: Alfa
          releaseNotes: "DJfy ${{ github.ref_name }} (build ${{ github.run_number }})"
          file: ./build/app/outputs/flutter-apk/app-release.apk
